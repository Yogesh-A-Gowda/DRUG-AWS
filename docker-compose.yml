services:
  classifier:
    build: ./classifier
    container_name: classifier
    ports:
      - "8001:7860"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      - MODEL_REVISION=${MODEL_REVISION:-}
      - DATASET_REVISION=${DATASET_REVISION:-}
    restart: unless-stopped

  chatbot:
    build: ./rag_chat
    container_name: chatbot
    ports:
      - "8002:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    env_file:
      - ./rag_chat/.env
    environment:
      - EMBEDDINGS_REVISION=${EMBEDDINGS_REVISION:-}
    restart: unless-stopped

volumes:
  hf-cache: